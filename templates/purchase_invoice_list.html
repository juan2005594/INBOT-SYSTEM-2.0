<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Facturas de Compra - Inbotf System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            padding: 30px;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .invoice-table th,
        .invoice-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .invoice-table th {
            background-color: #e9ecef;
            font-weight: bold;
            color: #555;
        }
        .invoice-table tr:nth-child(even) {
            background-color: #f6f6f6;
        }
        .invoice-table tr:hover {
            background-color: #e2e6ea;
        }
        .loading-message {
            text-align: center;
            font-size: 1.2em;
            color: #555;
            margin-top: 50px;
        }
        .back-button {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
        /* Estilos para el formulario de agregar factura de compra */
        .form-section {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 30px;
        }
        .form-section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-actions {
            text-align: center;
            margin-top: 20px;
        }
        .form-actions button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 5px;
        }
        .form-actions button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        /* Estilos para los detalles de la factura */
        .invoice-details-section {
            border: 1px solid #eee;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            background-color: #ffffff;
        }
        .invoice-details-section h3 {
            margin-top: 0;
            color: #555;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .detail-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 50px;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        .detail-row button {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }
        .detail-row button:hover {
            background-color: #c82333;
        }
        .add-detail-button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        .add-detail-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Facturas de Compra</h1>

        <div class="form-section">
            <h2>Registrar Nueva Factura de Compra</h2>
            <form id="addPurchaseInvoiceForm">
                {% csrf_token %}
                <div class="form-group">
                    <label for="numero_factura">Número de Factura:</label>
                    <input type="text" id="numero_factura" name="numero_factura" required>
                </div>
                <div class="form-group">
                    <label for="proveedor">Proveedor:</label>
                    <select id="proveedor" name="proveedor" required>
                        <!-- Opciones cargadas por JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha_compra">Fecha de Compra:</label>
                    <input type="date" id="fecha_compra" name="fecha_compra" required>
                </div>
                <div class="form-group">
                    <label for="porcentaje_ganancia_global">Porcentaje de Ganancia Global (%):</label>
                    <input type="number" id="porcentaje_ganancia_global" name="porcentaje_ganancia_global" min="0" max="100" step="0.01" value="30" placeholder="30">
                    <small style="color: #666; display: block; margin-top: 5px;">Este porcentaje se aplicará a todos los productos nuevos</small>
                </div>

                <div class="invoice-details-section">
                    <h3>Detalles de la Factura</h3>
                    <div id="details-container">
                        <!-- Filas de detalles se añadirán aquí con JS -->
                    </div>
                    <button type="button" class="add-detail-button" id="add-detail-row-button">Añadir Producto</button>
                </div>

                <div class="form-actions">
                    <button type="submit">Registrar Factura</button>
                </div>
                <div id="form-message" class="message" style="display: none;"></div>
            </form>
        </div>

        <div id="invoices-container">
            <p class="loading-message">Cargando facturas de compra...</p>
        </div>
        <a href="/dashboard/" class="back-button">Volver al Dashboard</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const invoicesContainer = document.getElementById('invoices-container');
            const apiURL = '/core-api/facturas-compra/'; // URL de tu API de facturas de compra
            const addPurchaseInvoiceForm = document.getElementById('addPurchaseInvoiceForm');
            const formMessage = document.getElementById('form-message');
            const proveedorSelect = document.getElementById('proveedor');
            const detailsContainer = document.getElementById('details-container');
            const addDetailRowButton = document.getElementById('add-detail-row-button');

            let products = []; // Para almacenar productos para los selectores
            let suppliers = []; // Para almacenar proveedores para los selectores
            let categories = []; // Para almacenar categorías para los selectores

            // Function to get CSRF token
            function getCookie(name) {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; i < cookies.length; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            }

            const token = localStorage.getItem('authToken');
            function getAuthHeaders(extraHeaders = {}) {
                const headers = { ...extraHeaders };
                if (token) {
                    headers['Authorization'] = `Token ${token}`;
                }
                return headers;
            }

            // Función para cargar proveedores
            async function loadSuppliers() {
                try {
                    const response = await fetch('/core-api/proveedores/', {
                        headers: getAuthHeaders()
                    });
                    suppliers = (await response.json()).results || [];
                    proveedorSelect.innerHTML = '<option value="">Seleccione un proveedor</option>';
                    suppliers.forEach(prov => {
                        const option = document.createElement('option');
                        option.value = prov.id;
                        option.textContent = prov.nombre;
                        proveedorSelect.appendChild(option);
                    });

                    // Cargar productos (TODOS, no solo la primera página)
                    products = [];
                    let page = 1;
                    while (true) {
                        const productsResponse = await fetch(`/core-api/productos/?page=${page}&format=json`, {
                            headers: getAuthHeaders()
                        });
                        const productsData = await productsResponse.json();
                        
                        if (productsData.results && productsData.results.length > 0) {
                            products = products.concat(productsData.results);
                        }
                        
                        if (!productsData.next) {
                            break;
                        }
                        page++;
                    }
                    
                    console.log(`Productos cargados para factura de compra: ${products.length}`);
                    
                    // Cargar categorías
                    try {
                        const categoriesResponse = await fetch('/core-api/categorias/', {
                            headers: getAuthHeaders()
                        });
                        categories = (await categoriesResponse.json()).results || [];
                        console.log('Categorías cargadas:', categories);
                    } catch (error) {
                        console.error('Error cargando categorías:', error);
                        categories = [];
                    }

                    // Añadir una fila de detalle inicial
                    addNewDetailRow();

                } catch (error) {
                    console.error('Error al cargar proveedores o productos:', error);
                    formMessage.textContent = 'Error al cargar opciones de proveedor/producto.';
                    formMessage.classList.add('error');
                    formMessage.style.display = 'block';
                }
            }
            
            // Función para cargar categorías
            async function loadCategories() {
                try {
                    const response = await fetch('/core-api/categorias/', {
                        headers: getAuthHeaders()
                    });
                    categories = (await response.json()).results || [];
                } catch (error) {
                    console.error('Error al cargar categorías:', error);
                }
            }

            // Función para cargar productos para los selectores de detalle de factura de compra
            async function loadProductsForDetails() {
                try {
                    // Cargar TODOS los productos (todas las páginas)
                    products = [];
                    let page = 1;
                    while (true) {
                        const response = await fetch(`/core-api/productos/?page=${page}&format=json`, {
                            headers: getAuthHeaders()
                        });
                        const productsData = await response.json();
                        
                        if (productsData.results && productsData.results.length > 0) {
                            products = products.concat(productsData.results);
                        }
                        
                        if (!productsData.next) {
                            break;
                        }
                        page++;
                    }
                    
                    console.log(`Productos recargados para detalles: ${products.length}`);
                    
                    // Populate existing product selects
                    document.querySelectorAll('.product-select').forEach(select => {
                        populateProductSelect(select);
                    });
                } catch (error) {
                    console.error('Error al cargar productos para detalles:', error);
                    alert('No se pudieron cargar los productos para los detalles de la factura: ' + error.message);
                }
            }

            // Helper function to populate a single product select dropdown
            function populateProductSelect(selectElement) {
                selectElement.innerHTML = '<option value="">Seleccione un producto</option>';
                products.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = product.nombre;
                    selectElement.appendChild(option);
                });
            }

            // Function to add a new detail row to the form
            function addNewDetailRow() {
                const newDetailRow = document.createElement('div');
                newDetailRow.className = 'detail-row';
                newDetailRow.innerHTML = `
                    <div class="form-group">
                        <label>Tipo de Producto:</label>
                        <select class="product-type-select" required>
                            <option value="existente">Producto Existente</option>
                            <option value="nuevo">Producto Nuevo</option>
                        </select>
                    </div>
                    <div class="form-group product-existing-group">
                        <label>Producto:</label>
                        <select name="producto" class="product-select">
                            <!-- Opciones cargadas por JS -->
                        </select>
                    </div>
                    <div class="product-new-group" style="display: none;">
                        <div class="form-group">
                            <label>Código de Barras:</label>
                            <input type="text" class="product-codigo" placeholder="Código de Barras">
                        </div>
                        <div class="form-group">
                            <label>Nombre del Producto:</label>
                            <input type="text" class="product-nombre" placeholder="Nombre del Producto" required>
                        </div>
                        <div class="form-group">
                            <label>Descripción:</label>
                            <textarea class="product-descripcion" placeholder="Descripción"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Categoría:</label>
                            <select class="product-categoria" required>
                                <option value="">Seleccione Categoría</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="number" name="cantidad" placeholder="Cantidad" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <input type="number" name="precio_unitario" placeholder="Precio Unitario" step="0.01" min="0" required>
                    </div>
                    <button type="button" class="remove-detail-row-button">X</button>
                `;
                detailsContainer.appendChild(newDetailRow);
                
                // Populate the product select in the newly added row
                const newProductSelect = newDetailRow.querySelector('.product-select');
                populateProductSelect(newProductSelect);
                
                // Populate categories select
                const categorySelect = newDetailRow.querySelector('.product-categoria');
                if (categorySelect && categories.length > 0) {
                    categorySelect.innerHTML = '<option value="">Seleccione Categoría</option>';
                    categories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.id;
                        option.textContent = cat.nombre;
                        categorySelect.appendChild(option);
                    });
                    console.log('Categorías pobladas en el selector:', categories.length);
                } else if (categorySelect) {
                    console.warn('No hay categorías disponibles para poblar el selector');
                }
                
                // Add event listener for product type change
                const productTypeSelect = newDetailRow.querySelector('.product-type-select');
                productTypeSelect.addEventListener('change', function() {
                    const isNew = this.value === 'nuevo';
                    const existingGroup = newDetailRow.querySelector('.product-existing-group');
                    const newGroup = newDetailRow.querySelector('.product-new-group');
                    existingGroup.style.display = isNew ? 'none' : 'block';
                    newGroup.style.display = isNew ? 'block' : 'none';
                    // Make required fields dynamic
                    existingGroup.querySelector('select').required = !isNew;
                    newGroup.querySelectorAll('input, select').forEach(el => el.required = isNew);
                });
            }

            // Event listener for adding a new detail row
            addDetailRowButton.addEventListener('click', addNewDetailRow);

            // Event listener for form submission
            addPurchaseInvoiceForm.addEventListener('submit', async function(event) {
                event.preventDefault();

                const numeroFactura = document.getElementById('numero_factura').value;
                const proveedorId = document.getElementById('proveedor').value;
                const fechaCompra = document.getElementById('fecha_compra').value;
                const porcentajeGananciaGlobal = document.getElementById('porcentaje_ganancia_global').value;

                const detalles = [];
                document.querySelectorAll('.detail-row').forEach(row => {
                    const productType = row.querySelector('.product-type-select').value;
                    const cantidad = row.querySelector('input[name="cantidad"]').value;
                    const precioUnitario = row.querySelector('input[name="precio_unitario"]').value;

                    if (!cantidad || !precioUnitario) return;

                    if (productType === 'existente') {
                        const productoId = row.querySelector('.product-select').value;
                        if (productoId) {
                            detalles.push({
                                producto: parseInt(productoId),
                                cantidad: parseInt(cantidad),
                                precio_unitario: parseFloat(precioUnitario)
                            });
                        }
                    } else if (productType === 'nuevo') {
                        const codigo = row.querySelector('.product-codigo').value;
                        const nombre = row.querySelector('.product-nombre').value;
                        const descripcion = row.querySelector('.product-descripcion').value;
                        const categoriaId = row.querySelector('.product-categoria').value;
                        
                        if (nombre && categoriaId) {
                            detalles.push({
                                producto_nuevo: true,
                                codigo_barras: codigo || '',
                                nombre: nombre,
                                descripcion: descripcion || 'Sin descripción',
                                categoria_id: parseInt(categoriaId),
                                cantidad: parseInt(cantidad),
                                precio_unitario: parseFloat(precioUnitario)
                            });
                        }
                    }
                });

                if (detalles.length === 0) {
                    displayMessage('Debe añadir al menos un producto a la factura.', 'error');
                    return;
                }

                const payload = {
                    numero_factura: numeroFactura,
                    proveedor: parseInt(proveedorId),
                    fecha_compra: fechaCompra,
                    porcentaje_ganancia_global: porcentajeGananciaGlobal ? parseFloat(porcentajeGananciaGlobal) : 30,
                    detalles: detalles
                };

                try {
                    console.log("Enviando factura de compra:", payload);
                    const response = await fetch(apiURL, {
                        method: 'POST',
                        headers: getAuthHeaders({
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        }),
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        displayMessage('Factura de compra registrada exitosamente!', 'success');
                        addPurchaseInvoiceForm.reset();
                        detailsContainer.innerHTML = ''; // Clear details
                        addNewDetailRow(); // Add a fresh empty row
                        loadPurchaseInvoices(); // Refresh the list of invoices
                        // Also refresh products for stock updates if needed
                        loadProductsForDetails();
                    } else {
                        const errorData = await response.json();
                        let errorMessage = 'Error al registrar factura de compra.';
                        if (errorData.detail) {
                            errorMessage += ` Detalles: ${errorData.detail}`;
                        } else if (errorData.detalles) {
                            errorMessage += ' Errores en los detalles:';
                            errorData.detalles.forEach(detailError => {
                                for (const key in detailError) {
                                    errorMessage += ` ${key}: ${detailError[key].join(', ')}`;
                                }
                            });
                        }
                        displayMessage(errorMessage, 'error');
                        console.error('Error al registrar factura de compra:', errorData);
                    }
                } catch (error) {
                    displayMessage('Error de red o del servidor al registrar factura de compra.', 'error');
                    console.error('Error de red/servidor:', error);
                }
            });

            // Event listener for removing a detail row (delegated)
            detailsContainer.addEventListener('click', function(event) {
                if (event.target.classList.contains('remove-detail-row-button')) {
                    event.target.closest('.detail-row').remove();
                }
            });

            // Initial load of the first detail row
            addNewDetailRow();

            // Function to display messages
            function displayMessage(message, type) {
                formMessage.textContent = message;
                formMessage.className = `message ${type}`;
                formMessage.style.display = 'block';
                setTimeout(() => {
                    formMessage.style.display = 'none';
                }, 5000);
            }

            // Initial load of suppliers and products (for the form)
            loadSuppliers();
            loadProductsForDetails(); // Call this to populate product dropdowns
        });
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% include "includes/inbotf_chatbot.html" %}
</body>
</html>
