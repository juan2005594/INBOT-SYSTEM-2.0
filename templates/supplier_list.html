<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proveedores - Inbotf System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            padding: 30px;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        .supplier-list {
            list-style: none;
            padding: 0;
        }
        .supplier-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s ease-in-out;
        }
        .supplier-item:hover {
            transform: translateY(-3px);
        }
        .supplier-item h2 {
            font-size: 1.4em;
            color: #333;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .supplier-item p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .loading-message {
            text-align: center;
            font-size: 1.2em;
            color: #555;
            margin-top: 50px;
        }
        .back-button {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
        /* Estilos para el formulario de agregar proveedor */
        .form-section {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 30px;
        }
        .form-section h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-actions {
            text-align: center;
            margin-top: 20px;
        }
        .form-actions button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .form-actions button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Proveedores Registrados</h1>

        <div class="form-section">
            <h2>Agregar Nuevo Proveedor</h2>
            <form id="addSupplierForm">
                <div class="form-group">
                    <label for="nombre">Nombre del Proveedor:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="nit">NIT:</label>
                    <input type="text" id="nit" name="nit" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" required>
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <textarea id="direccion" name="direccion" required></textarea>
                </div>
                <div class="form-group">
                    <label for="email">Email (opcional):</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-actions">
                    <button type="submit">Agregar Proveedor</button>
                </div>
                <div id="form-message" class="message" style="display: none;"></div>
            </form>
        </div>

        <ul id="supplier-list" class="supplier-list">
            <p class="loading-message">Cargando proveedores...</p>
        </ul>
        <a href="/dashboard/" class="back-button">Volver al Dashboard</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            function getAuthHeaders(extraHeaders = {}) {
                const headers = { ...extraHeaders };
                if (token) {
                    headers['Authorization'] = `Token ${token}`;
                }
                return headers;
            }

            const supplierList = document.getElementById('supplier-list');
            const apiURL = '/core-api/proveedores/'; // URL de tu API de proveedores
            const addSupplierForm = document.getElementById('addSupplierForm');
            const formMessage = document.getElementById('form-message');

            // Función para cargar proveedores
            async function loadSuppliers() {
                try {
                    const response = await fetch(apiURL, {
                        headers: getAuthHeaders()
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    supplierList.innerHTML = ''; // Limpiar el mensaje de carga
                    if (data.results && data.results.length > 0) {
                        data.results.forEach(supplier => {
                            const listItem = document.createElement('li');
                            listItem.classList.add('supplier-item');
                            listItem.innerHTML = `
                                <h2>${supplier.nombre}</h2>
                                <p><strong>NIT:</strong> ${supplier.nit}</p>
                                <p><strong>Teléfono:</strong> ${supplier.telefono}</p>
                                <p><strong>Dirección:</strong> ${supplier.direccion}</p>
                                <p><strong>Email:</strong> ${supplier.email || 'No disponible'}</p>
                            `;
                            supplierList.appendChild(listItem);
                        });
                    } else {
                        supplierList.innerHTML = '<p class="loading-message">No hay proveedores disponibles.</p>';
                    }
                } catch (error) {
                    console.error('Error al cargar los proveedores:', error);
                    supplierList.innerHTML = `<p class="loading-message" style="color: red;">Error al cargar proveedores: ${error.message}</p>`;
                }
            }
            
            // Cargar proveedores al iniciar la página
            loadSuppliers();

            // Manejar el envío del formulario
            addSupplierForm.addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(addSupplierForm);
                const supplierData = {};
                formData.forEach((value, key) => {
                    supplierData[key] = value;
                });

                try {
                    const response = await fetch(apiURL, {
                        method: 'POST',
                        headers: getAuthHeaders({
                            'Content-Type': 'application/json',
                        }),
                        body: JSON.stringify(supplierData),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`Error al agregar proveedor: ${JSON.stringify(errorData)}`);
                    }

                    formMessage.textContent = 'Proveedor agregado exitosamente!';
                    formMessage.classList.remove('error');
                    formMessage.classList.add('success');
                    formMessage.style.display = 'block';
                    addSupplierForm.reset(); // Limpiar el formulario
                    loadSuppliers(); // Recargar la lista de proveedores

                } catch (error) {
                    console.error('Error al agregar proveedor:', error);
                    formMessage.textContent = `Error: ${error.message}`;
                    formMessage.classList.add('error');
                    formMessage.style.display = 'block';
                }
            });
        });
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% include "includes/inbotf_chatbot.html" %}
</body>
</html>
